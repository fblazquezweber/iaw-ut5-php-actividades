<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h1>Cálculo aritmético</h1>

        <form action="calcular.php" method="POST">
            <div class="mb-3">
                <label for="numero1" class="form-label">Número 1</label>
                <input type="text" class="form-control" id="numero1" name="numero1">
            </div>

            <div class="mb-3">
                <label for="numero2" class="form-label">Número 2</label>
                <input type="text" class="form-control" id="numero2" name="numero2">
            </div>

            <div class="mb-3">
                <label for="operacion" class="form-label">Operación</label>
                <select class="form-select" id="operacion" name="operacion">
                    <option value="suma">Suma</option>
                    <option value="resta">Resta</option>
                    <option value="multiplicacion">Multiplicación</option>
                    <option value="division">División</option>
                    <option value="factorial">Factorial</option>
                    <option value="potencia">Potencia</option>
                    <option value="mayor">El más grande</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Calcular</button>
        </form>
    </div>

</body>
</html>
